{% extends 'base.html' %}
{% block title %}Departments{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0"><i class="bi bi-building me-2 text-primary"></i>Departments</h4>
    <a href="{% url 'department_create' %}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle me-2"></i>Add Department
    </a>
</div>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr><th>Name</th><th>Code</th><th>Students</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for dept in departments %}
                <tr>
                    <td>{{ dept.name }}</td>
                    <td><code>{{ dept.code }}</code></td>
                    <td><span class="badge bg-info">{{ dept.student_count }}</span></td>
                    <td>
                        <a href="{% url 'department_edit' dept.pk %}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-center text-muted py-4">No departments found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
